name: minijobnow
description: "kommt noch :)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  sensors_plus: ^7.0.0
  flutter_native_splash: ^2.4.7
  mjn_liquid_ui: ^0.2.0
  intl: ^0.20.2
  dropdown_button2: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#0D0D0D"
  image: "assets/icons/logo.png"
  branding: "assets/icons/branding.png"
